<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Juego para mi Novia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffb6c1;
        }
        canvas {
            background: #ffb6c1;
            image-rendering: pixelated;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        /* Bloqueo horizontal */
        #rotate-device-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111;
            color: white;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .phone-icon {
            width: 50px;
            height: 90px;
            border: 3px solid #fff;
            border-radius: 10px;
            animation: rotatePhone 2s infinite ease-in-out;
            margin-bottom: 20px;
        }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        /* Opciones del jugador */
        #options-modal {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #d81b60;
            border-radius: 12px;
            padding: 15px;
            width: 90%;
            max-width: 450px;
            z-index: 500;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            text-align: center;
        }
        .hide-modal {
            display: none !important;
        }
        .btn-option {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #ffe6eb;
            border: 2px solid #d81b60;
            color: #d81b60;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-option:active {
            background: #d81b60;
            color: white;
        }

        /* Botón Iniciar Inicial */
        #start-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 35px;
            font-size: 20px;
            font-weight: bold;
            color: #d81b60;
            background: #ffffff;
            border: 4px solid #d81b60;
            border-radius: 12px;
            box-shadow: 0 6px 0px #d81b60;
            cursor: pointer;
            z-index: 100;
        }
        #start-btn:active {
            transform: translate(-50%, -46%);
            box-shadow: 0 2px 0px #d81b60;
        }

        /* D-PAD táctil */
        #dpad {
            display: none;
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 130px;
            height: 130px;
            z-index: 200;
        }
        .dpad-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid #d81b60;
            border-radius: 8px;
            touch-action: manipulation;
        }
        .dpad-btn:active { background: rgba(216, 27, 96, 0.6); }
        #btn-up { top: 0; left: 45px; width: 40px; height: 40px; }
        #btn-down { bottom: 0; left: 45px; width: 40px; height: 40px; }
        #btn-left { top: 45px; left: 0; width: 40px; height: 40px; }
        #btn-right { top: 45px; right: 0; width: 40px; height: 40px; }
    </style>
</head>
<body>

    <div id="rotate-device-screen">
        <div class="phone-icon"></div>
        <h2>Por favor gira tu celular</h2>
        <p>Este juego está diseñado para jugarse en modo horizontal.</p>
    </div>

    <div id="game-container">
        <button id="start-btn">INICIAR</button>
        <canvas id="gameCanvas"></canvas>

        <div id="options-modal">
            <button class="btn-option" id="opt-1">1- Pedirle el Num</button>
            <button class="btn-option" id="opt-2">2- Ir a contarles a mis amigas</button>
        </div>

        <div id="dpad">
            <div class="dpad-btn" id="btn-up"></div>
            <div class="dpad-btn" id="btn-down"></div>
            <div class="dpad-btn" id="btn-left"></div>
            <div class="dpad-btn" id="btn-right"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const optionsModal = document.getElementById('options-modal');
        const dpad = document.getElementById('dpad');
        const rotateScreen = document.getElementById('rotate-device-screen');

        const V_WIDTH = 480;
        const V_HEIGHT = 270;
        canvas.width = V_WIDTH;
        canvas.height = V_HEIGHT;

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateScreen.style.display = 'flex';
            } else {
                rotateScreen.style.display = 'none';
            }
            resizeCanvas();
        }

        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / V_WIDTH, window.innerHeight / V_HEIGHT);
            canvas.style.width = (V_WIDTH * scale) + 'px';
            canvas.style.height = (V_HEIGHT * scale) + 'px';
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('load', checkOrientation);

        let gameState = 'START_SCREEN';
        let hearts = [];
        for(let i=0; i<30; i++) {
            hearts.push({
                x: Math.random() < 0.5 ? Math.random()*80 : V_WIDTH - 80 + Math.random()*80,
                y: Math.random() * V_HEIGHT,
                speed: 0.5 + Math.random()*1.5,
                size: 6 + Math.random()*8
            });
        }

        let girl = { x: 50, y: 150, w: 20, h: 32, speed: 2 };
        let guy = { x: 380, y: 150, w: 20, h: 32 };
        let keys = {};
        let cutsceneTimer = 0;
        let subState = 0;
        let fadeAlpha = 0;

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function setupTouchBtn(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        }
        setupTouchBtn('btn-up', 'ArrowUp');
        setupTouchBtn('btn-down', 'ArrowDown');
        setupTouchBtn('btn-left', 'ArrowLeft');
        setupTouchBtn('btn-right', 'ArrowRight');

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            gameState = 'INTERACTIVE_MEET';
            dpad.style.display = 'block';
        });

        // Ocultamiento directo instantáneo al presionar opciones
        document.getElementById('opt-1').addEventListener('click', (e) => {
            e.stopPropagation();
            optionsModal.classList.add('hide-modal');
            optionsModal.style.display = 'none';
            gameState = 'OPTION_1_END';
            cutsceneTimer = 0;
        });

        document.getElementById('opt-2').addEventListener('click', (e) => {
            e.stopPropagation();
            optionsModal.classList.add('hide-modal');
            optionsModal.style.display = 'none';
            gameState = 'FADE_BLACK';
            nextStateAfterFade = 'GIRLS_SCENE';
            cutsceneTimer = 0;
        });

        function drawHeart(x, y, size, color='#d81b60') {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x - size/4, y - size/4, size/4, Math.PI, 0, false);
            ctx.arc(x + size/4, y - size/4, size/4, Math.PI, 0, false);
            ctx.lineTo(x, y + size/2);
            ctx.closePath();
            ctx.fill();
        }

        function drawChar(x, y, isGirl, skinTone='#ffe0bd', isShort=false) {
            let height = isShort ? 24 : 32;
            let width = isShort ? 16 : 20;

            // Cuerpo/Ropa
            if(isGirl) {
                ctx.fillStyle = '#800020'; // Chomba bordó
                ctx.fillRect(x+2, y+10, width-4, 10);
                ctx.fillRect(x, y+20, width, 6); // Falda bordó
            } else {
                ctx.fillStyle = '#800020'; // Chomba bordó
                ctx.fillRect(x+2, y+10, width-4, 10);
                ctx.fillStyle = '#707070'; // Pantalón gris
                ctx.fillRect(x+3, y+20, width-6, 8);
            }
            
            // Zapatos
            ctx.fillStyle = '#111';
            ctx.fillRect(x+2, y+height-4, 5, 4);
            ctx.fillRect(x+width-7, y+height-4, 5, 4);

            // Cabeza
            ctx.fillStyle = skinTone;
            ctx.fillRect(x+3, y, width-6, 10);

            // Cabello Negro Corto
            ctx.fillStyle = '#111';
            ctx.fillRect(x+2, y-2, width-4, 5);
            ctx.fillRect(x+1, y, 3, 8);
            ctx.fillRect(x+width-4, y, 3, 8);
        }

        // Burbujas nítidas de alta legibilidad
        function drawVectorBubble(text, x, y, width=140) {
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.roundRect(x, y, width, 30, 8);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 11px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, x + width/2, y + 19);
            ctx.restore();
        }

        let nextStateAfterFade = '';

        function update() {
            if(gameState === 'START_SCREEN') {
                hearts.forEach(h => {
                    h.y += h.speed;
                    if(h.y > V_HEIGHT) h.y = -10;
                });
            }

            if(gameState === 'INTERACTIVE_MEET') {
                if(keys['ArrowUp'] && girl.y > 60) girl.y -= girl.speed;
                if(keys['ArrowDown'] && girl.y < V_HEIGHT - 40) girl.y += girl.speed;
                if(keys['ArrowLeft'] && girl.x > 10) girl.x -= girl.speed;
                if(keys['ArrowRight'] && girl.x < V_WIDTH - 30) girl.x += girl.speed;

                let dist = Math.hypot(girl.x - guy.x, girl.y - guy.y);
                if(dist < 35) {
                    gameState = 'CHOICE_MENU';
                    dpad.style.display = 'none';
                    optionsModal.classList.remove('hide-modal');
                    optionsModal.style.display = 'block';
                }
            }

            cutsceneTimer++;
        }

        function render() {
            ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

            if(gameState === 'START_SCREEN') {
                ctx.fillStyle = '#ffb6c1';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                hearts.forEach(h => drawHeart(h.x, h.y, h.size));

                ctx.fillStyle = '#d81b60';
                ctx.font = 'bold 28px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('Sabes algo?', V_WIDTH/2, 100);
            }

            else if(gameState === 'INTERACTIVE_MEET' || gameState === 'CHOICE_MENU') {
                ctx.fillStyle = '#e2f0d9'; // Césped
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                drawChar(guy.x, guy.y, false);
                drawChar(girl.x, girl.y, true);
            }

            else if(gameState === 'OPTION_1_END') {
                ctx.fillStyle = '#e2f0d9';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                drawChar(guy.x, guy.y, false);
                drawVectorBubble("########", guy.x - 50, guy.y - 35, 100);

                if(cutsceneTimer > 40) {
                    girl.x -= 4;
                    drawChar(girl.x, girl.y, true);
                } else {
                    drawChar(girl.x, girl.y, true);
                }
            }

            else if(gameState === 'FADE_BLACK') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);
                if(cutsceneTimer > 30) {
                    gameState = nextStateAfterFade;
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'GIRLS_SCENE') {
                ctx.fillStyle = '#a9dfbf';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                drawChar(150, 140, true, '#ffe0bd');
                drawChar(210, 140, true, '#ffe0bd');
                drawChar(270, 140, true, '#8d5524'); // Amiga piel oscura

                if(cutsceneTimer < 90) {
                    drawVectorBubble("Me enamoré!", 140, 95, 100);
                } else {
                    drawHeart(160, 110, 10);
                    drawHeart(220, 110, 10);
                    drawHeart(280, 110, 10);
                }

                if(cutsceneTimer > 150) {
                    gameState = 'FADE_BLACK';
                    nextStateAfterFade = 'BOYS_SCENE';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'BOYS_SCENE') {
                ctx.fillStyle = '#a9dfbf';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                drawChar(140, 140, false); 
                drawChar(220, 140, false); 
                drawChar(300, 148, false, '#ffe0bd', true); // Amigo más pequeño

                if(cutsceneTimer < 60) {
                    drawVectorBubble("Me enamoré bld", 90, 95, 120);
                } else if(cutsceneTimer < 120) {
                    drawVectorBubble("¿Quién es?", 260, 100, 90);
                } else if(cutsceneTimer < 180) {
                    drawVectorBubble("La Sol Luis o Ruiz no se", 40, 95, 170);
                } else if(cutsceneTimer < 240) {
                    drawVectorBubble("La blanca del fondo", 240, 100, 140);
                } else if(cutsceneTimer < 300) {
                    drawVectorBubble("Sii esaaa", 100, 95, 90);
                } else if(cutsceneTimer < 380) {
                    drawVectorBubble("Que bien Gallo, ojala sean pareja", 180, 100, 220);
                } else {
                    gameState = 'FADE_BLACK';
                    nextStateAfterFade = 'PHONE_SCENE';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'PHONE_SCENE') {
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                // Celular Nítido
                ctx.save();
                ctx.fillStyle = '#333';
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(V_WIDTH/2 - 60, 40, 120, 190, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#25d366';
                ctx.fillRect(V_WIDTH/2 - 52, 65, 104, 145);

                drawVectorBubble("Holaaaa, soy gallo", V_WIDTH/2 - 90, 75, 130);

                if(cutsceneTimer > 80) {
                    drawVectorBubble("Holaaaa okokkk", V_WIDTH/2 - 30, 125, 120);
                }
                ctx.restore();

                if(cutsceneTimer > 170) {
                    gameState = 'YELLOW_TRANSITION_1';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'YELLOW_TRANSITION_1') {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("Días Después...", V_WIDTH/2, V_HEIGHT/2);

                if(cutsceneTimer > 100) {
                    gameState = 'BEDROOM_SCENE';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'BEDROOM_SCENE') {
                ctx.fillStyle = '#2c3e50';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                // Cama
                ctx.fillStyle = '#ecf0f1';
                ctx.fillRect(100, 160, 120, 40);
                drawChar(120, 150, false); 

                drawVectorBubble("Que linda que es...", 130, 90, 140);

                if(cutsceneTimer > 90) {
                    drawVectorBubble("Holaaaaaaa", 260, 130, 110);
                }
                if(cutsceneTimer > 140) {
                    drawVectorBubble("bienn y vosssss?", 260, 170, 130);
                }

                if(cutsceneTimer > 220) {
                    gameState = 'YELLOW_TRANSITION_2';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'YELLOW_TRANSITION_2') {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 24px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("¿Si me declaro?", V_WIDTH/2, V_HEIGHT/2);

                if(cutsceneTimer > 100) {
                    gameState = 'PROPOSAL_SCENE';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'PROPOSAL_SCENE') {
                ctx.fillStyle = '#a9dfbf';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                drawChar(200, 140, false);
                drawChar(250, 140, true);

                if(cutsceneTimer < 90) {
                    drawVectorBubble("¿Quieres ser mi novia?", 120, 95, 170);
                } else if(cutsceneTimer < 160) {
                    drawVectorBubble("mmmmm bueno", 230, 95, 120);
                } else {
                    girl.x += 6;
                    drawChar(girl.x, 140, true);
                }

                if(cutsceneTimer > 210) {
                    gameState = 'FINAL_LOVE';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'FINAL_LOVE') {
                ctx.fillStyle = '#ffb6c1';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                ctx.fillStyle = '#d81b60';
                ctx.font = 'bold 22px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("TE AMO MI GORDITA HERMOSA", V_WIDTH/2, V_HEIGHT/2);

                // Duración exacta de 2 segundos (120 frames a 60fps)
                if(cutsceneTimer > 120) {
                    gameState = 'FINAL_DATE';
                    cutsceneTimer = 0;
                }
            }

            else if(gameState === 'FINAL_DATE') {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 28px Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("14/04/26", V_WIDTH/2, V_HEIGHT/2);

                // Se mantiene la fecha final por 2 segundos también (120 frames)
                if(cutsceneTimer > 120) {
                    // Fin del flujo
                }
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
