<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sabes algo?</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Retro Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Press Start 2P', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Advertencia cuando está en modo vertical */
        #portrait-warning {
            display: none;
            position: fixed;
            inset: 0;
            background-color: #0d0f18;
            color: #ffffff;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        @media screen and (orientation: portrait) {
            #portrait-warning {
                display: flex !important;
            }
        }

        .phone-rotate-icon {
            width: 50px;
            height: 85px;
            border: 4px solid #ff69b4;
            border-radius: 12px;
            margin-bottom: 20px;
            position: relative;
            animation: rotatePhone 2s ease-in-out infinite;
        }
        .phone-rotate-icon::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 3px;
            background-color: #ff69b4;
            border-radius: 2px;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        /* Contenedor principal adaptable */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background-color: #7ec850;
        }

        /* Lluvia de corazones */
        .heart-particle {
            position: absolute;
            color: #ff4b72;
            pointer-events: none;
            animation: fall linear infinite;
            z-index: 5;
        }

        @keyframes fall {
            0% {
                transform: translateY(-40px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Botón Retro */
        .btn-retro {
            background-color: #ffffff;
            border: 3px solid #333333;
            box-shadow: 3px 3px 0px #333333;
            color: #333333;
            transition: all 0.05s ease;
            cursor: pointer;
        }
        .btn-retro:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #333333;
        }

        /* Controles Táctiles (D-Pad) optimizados para horizontal */
        .dpad-btn {
            background-color: rgba(255, 255, 255, 0.88);
            border: 2px solid #222;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.4);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #222;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .dpad-btn:active {
            background-color: #ffd1dc;
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px rgba(0,0,0,0.4);
        }

        /* Transición de Ocultación Inmediata para el Modal */
        .hide-modal {
            display: none !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>

    <!-- Pantalla de bloqueo si el cel está vertical -->
    <div id="portrait-warning">
        <div class="phone-rotate-icon"></div>
        <h2 class="text-xs text-pink-400 mb-2 leading-relaxed">¡GIRA TU CELULAR!</h2>
        <p class="text-[9px] text-gray-300 max-w-xs leading-normal">
            Pon tu celular horizontalmente para disfrutar el juego en pantalla completa.
        </p>
    </div>

    <div id="game-wrapper">
        <!-- Canvas de renderizado en resolución pixel-art horizontal 16:9 -->
        <canvas id="gameCanvas" width="480" height="270"></canvas>

        <!-- Botones Táctiles D-Pad -->
        <div id="dpad-overlay" class="hidden absolute bottom-2 left-3 right-3 flex justify-between items-end z-20 pointer-events-none">
            <div class="grid grid-cols-3 gap-1 w-28 h-28 pointer-events-auto">
                <div></div>
                <button id="btn-up" class="dpad-btn">▲</button>
                <div></div>
                <button id="btn-left" class="dpad-btn">◄</button>
                <div></div>
                <button id="btn-right" class="dpad-btn">►</button>
                <div></div>
                <button id="btn-down" class="dpad-btn">▼</button>
                <div></div>
            </div>
            
            <div class="pointer-events-none bg-white/95 px-2 py-1 rounded-lg border-2 border-pink-400 text-[8px] text-pink-700 font-bold max-w-[150px] text-center mb-1 shadow-md">
                Acércate a Gallo 💖
            </div>
        </div>

        <!-- Modal de Opciones (Se oculta al INSTANTE) -->
        <div id="choice-modal" class="hidden absolute inset-0 bg-black/60 flex flex-col items-center justify-center p-3 z-50">
            <div class="bg-white border-4 border-black p-4 rounded-xl w-72 max-w-full text-center shadow-2xl">
                <p class="text-[9px] mb-3 leading-relaxed text-pink-600 font-bold">¿Qué quieres hacer?</p>
                <button id="choice-1" class="w-full btn-retro py-2 text-[8px] mb-2 bg-pink-50 hover:bg-pink-100">1- Pedirle el Num</button>
                <button id="choice-2" class="w-full btn-retro py-2 text-[8px] bg-pink-50 hover:bg-pink-100">2- Ir a contarles a mis amigas</button>
            </div>
        </div>

        <!-- Pantalla de Inicio -->
        <div id="title-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-pink-300 z-40">
            <div id="hearts-container" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
            
            <div class="z-10 text-center px-4">
                <h1 class="text-base md:text-xl text-white drop-shadow-[0_3px_0_#d53f8c] mb-5 leading-normal animate-pulse">
                    Sabes algo?
                </h1>
                <button id="btn-start" class="btn-retro px-5 py-2.5 text-xs bg-pink-100 text-pink-600 border-pink-700 font-bold">
                    INICIAR
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- MOTOR DEL JUEGO ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        const titleScreen = document.getElementById('title-screen');
        const btnStart = document.getElementById('btn-start');
        const heartsContainer = document.getElementById('hearts-container');
        const dpadOverlay = document.getElementById('dpad-overlay');
        const choiceModal = document.getElementById('choice-modal');
        const choice1Btn = document.getElementById('choice-1');
        const choice2Btn = document.getElementById('choice-2');

        const btnUp = document.getElementById('btn-up');
        const btnDown = document.getElementById('btn-down');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');

        const STAGES = {
            TITLE: 0,
            INTERACTIVE_COURTYARD: 1,
            CHOICE_FAIL: 2,
            TRANSITION_BLACK_1: 3,
            CUTSCENE_GIRLS: 4,
            CUTSCENE_BOYS: 5,
            CUTSCENE_ROOM_PHONE_1: 6,
            TRANSITION_DAYS: 7,
            CUTSCENE_BED_PHONE: 8,
            TRANSITION_DECLARATION: 9,
            CUTSCENE_FINAL_PROPOSAL: 10,
            FINAL_TE_AMO: 11,
            FINAL_DATE: 12
        };

        let currentStage = STAGES.TITLE;
        let fadeAlpha = 0;
        let isFading = false;
        let timer = 0;

        const player = { x: 50, y: 190, speed: 2, width: 24, height: 36, walking: false };
        const mainBoy = { x: 380, y: 190, width: 24, height: 36 };

        const keys = { up: false, down: false, left: false, right: false };

        function generateHearts() {
            heartsContainer.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart-particle';
                heart.innerHTML = '♥';
                heart.style.left = (Math.random() < 0.5 ? Math.random() * 20 : 80 + Math.random() * 20) + '%';
                heart.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
                heart.style.animationDelay = (Math.random() * 2) + 's';
                heart.style.fontSize = (Math.random() * 12 + 10) + 'px';
                heartsContainer.appendChild(heart);
            }
        }
        generateHearts();

        // Teclado
        window.addEventListener('keydown', (e) => {
            if (currentStage !== STAGES.INTERACTIVE_COURTYARD) return;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        function bindTouch(btn, key) {
            const press = (e) => { e.preventDefault(); keys[key] = true; };
            const release = (e) => { e.preventDefault(); keys[key] = false; };
            btn.addEventListener('touchstart', press, { passive: false });
            btn.addEventListener('touchend', release, { passive: false });
            btn.addEventListener('mousedown', press);
            btn.addEventListener('mouseup', release);
        }
        bindTouch(btnUp, 'up');
        bindTouch(btnDown, 'down');
        bindTouch(btnLeft, 'left');
        bindTouch(btnRight, 'right');

        btnStart.addEventListener('click', () => {
            titleScreen.style.display = 'none';
            dpadOverlay.classList.remove('hidden');
            currentStage = STAGES.INTERACTIVE_COURTYARD;
        });

        // FUNCIONALIDAD CORREGIDA: Ocultamiento inmediato del modal
        function hideModalInstantly() {
            choiceModal.classList.add('hide-modal');
            choiceModal.classList.add('hidden');
        }

        choice1Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideModalInstantly();
            dpadOverlay.classList.add('hidden');
            currentStage = STAGES.CHOICE_FAIL;
            timer = 0;
        });

        choice2Btn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideModalInstantly();
            dpadOverlay.classList.add('hidden');
            triggerFade(() => {
                currentStage = STAGES.CUTSCENE_GIRLS;
                timer = 0;
            });
        });

        function triggerFade(callback, duration = 25) {
            isFading = true;
            fadeAlpha = 0;
            let intervalIn = setInterval(() => {
                fadeAlpha += 0.1;
                if (fadeAlpha >= 1) {
                    fadeAlpha = 1;
                    clearInterval(intervalIn);
                    if (callback) callback();
                    let intervalOut = setInterval(() => {
                        fadeAlpha -= 0.1;
                        if (fadeAlpha <= 0) {
                            fadeAlpha = 0;
                            isFading = false;
                            clearInterval(intervalOut);
                        }
                    }, duration);
                }
            }, duration);
        }

        // --- DIBUJO DE SPRITES PIXEL ART ---
        function drawGirl(x, y, skinColor = '#FDE2D1', isRunning = false) {
            ctx.save();
            ctx.translate(Math.round(x), Math.round(y));

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(12, 34, 10, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1A1A1A';
            ctx.fillRect(4, 3, 16, 13);

            ctx.fillStyle = skinColor;
            ctx.fillRect(6, 6, 12, 10);

            ctx.fillStyle = '#000000';
            ctx.fillRect(8, 9, 2, 3);
            ctx.fillRect(14, 9, 2, 3);

            ctx.fillStyle = '#FF9999';
            ctx.fillRect(7, 11, 2, 1);
            ctx.fillRect(15, 11, 2, 1);

            ctx.fillStyle = '#1A1A1A';
            ctx.fillRect(5, 3, 14, 4);

            ctx.fillStyle = '#800020';
            ctx.fillRect(6, 16, 12, 8);
            ctx.fillStyle = '#A01135';
            ctx.fillRect(9, 16, 6, 3);

            ctx.fillStyle = '#660019';
            ctx.fillRect(5, 24, 14, 5);

            ctx.fillStyle = skinColor;
            let legOffset = isRunning ? (Math.sin(Date.now() / 60) * 3) : 0;
            ctx.fillRect(7 + legOffset, 29, 3, 4);
            ctx.fillRect(12 - legOffset, 29, 3, 4);

            ctx.fillStyle = '#222222';
            ctx.fillRect(6 + legOffset, 33, 4, 3);
            ctx.fillRect(12 - legOffset, 33, 4, 3);

            ctx.restore();
        }

        function drawBoy(x, y, isShort = false, isLying = false) {
            ctx.save();
            ctx.translate(Math.round(x), Math.round(y));

            if (isLying) {
                ctx.fillStyle = '#3e2723';
                ctx.fillRect(-10, 0, 55, 35);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-8, 4, 14, 26);
                ctx.fillStyle = '#800020';
                ctx.fillRect(6, 4, 36, 26);

                ctx.fillStyle = '#FDE2D1';
                ctx.fillRect(-4, 10, 10, 12);
                ctx.fillStyle = '#1A1A1A';
                ctx.fillRect(-6, 8, 12, 8);
                ctx.restore();
                return;
            }

            let yOffset = isShort ? 6 : 0;

            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(12, 34 + yOffset, 10, 3, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1A1A1A';
            ctx.fillRect(5, 2 + yOffset, 14, 8);

            ctx.fillStyle = '#FDE2D1';
            ctx.fillRect(6, 6 + yOffset, 12, 10);

            ctx.fillStyle = '#000000';
            ctx.fillRect(8, 9 + yOffset, 2, 2);
            ctx.fillRect(14, 9 + yOffset, 2, 2);

            ctx.fillStyle = '#800020';
            ctx.fillRect(5, 16 + yOffset, 14, 9);

            ctx.fillStyle = '#777777';
            ctx.fillRect(6, 25 + yOffset, 12, 7);

            ctx.fillStyle = '#111111';
            ctx.fillRect(6, 32 + yOffset, 4, 4);
            ctx.fillRect(14, 32 + yOffset, 4, 4);

            ctx.restore();
        }

        function drawBubble(x, y, text, isThought = false) {
            ctx.save();
            ctx.font = '6px "Press Start 2P"';
            let padding = 5;
            let metrics = ctx.measureText(text);
            let width = metrics.width + padding * 2;
            let height = 18;

            let bx = x - width / 2;
            let by = y - height - 12;

            if (bx < 4) bx = 4;
            if (bx + width > canvas.width - 4) bx = canvas.width - width - 4;

            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;

            if (isThought) {
                ctx.beginPath();
                ctx.ellipse(bx + width / 2, by + height / 2, width / 2, height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x, y - 6, 3, 0, Math.PI * 2);
                ctx.arc(x - 2, y - 2, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            } else {
                ctx.fillRect(bx, by, width, height);
                ctx.strokeRect(bx, by, width, height);

                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(x - 3, by + height);
                ctx.lineTo(x + 3, by + height);
                ctx.lineTo(x, by + height + 4);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            ctx.fillText(text, bx + width / 2, by + 12);

            ctx.restore();
        }

        function drawGrassBG() {
            ctx.fillStyle = '#7EC850';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#6cb73f';
            for (let i = 0; i < canvas.width; i += 24) {
                for (let j = 0; j < canvas.height; j += 24) {
                    if ((i + j) % 5 === 0) ctx.fillRect(i, j, 4, 4);
                }
            }

            ctx.fillStyle = '#e8cdb0';
            ctx.fillRect(0, 160, canvas.width, 110);
        }

        function drawDarkRoomBG() {
            ctx.fillStyle = '#111325';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1c2541';
            ctx.fillRect(40, 20, 80, 70);
            ctx.strokeStyle = '#3a506b';
            ctx.lineWidth = 3;
            ctx.strokeRect(40, 20, 80, 70);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(65, 40, 2, 2);
            ctx.fillRect(90, 60, 2, 2);
            ctx.fillRect(55, 70, 2, 2);
        }

        function drawPhoneChat(msgTop, msgBottom) {
            let px = canvas.width / 2 - 80;
            let py = canvas.height / 2 - 80;

            ctx.fillStyle = '#222';
            ctx.fillRect(px, py, 160, 160);
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(px + 6, py + 10, 148, 140);

            ctx.font = '6px "Press Start 2P"';

            if (msgTop) {
                ctx.fillStyle = '#DCF8C6';
                ctx.fillRect(px + 12, py + 24, 134, 34);
                ctx.fillStyle = '#000';
                ctx.textAlign = 'left';

                let words = msgTop.split(' ');
                ctx.fillText(words.slice(0, 3).join(' '), px + 16, py + 38);
                ctx.fillText(words.slice(3).join(' '), px + 16, py + 50);
            }

            if (msgBottom) {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(px + 24, py + 75, 120, 28);
                ctx.fillStyle = '#000';
                ctx.textAlign = 'left';
                ctx.fillText(msgBottom, px + 28, py + 92);
            }
        }

        function update() {
            if (currentStage === STAGES.INTERACTIVE_COURTYARD) {
                player.walking = keys.up || keys.down || keys.left || keys.right;

                if (keys.up) player.y -= player.speed;
                if (keys.down) player.y += player.speed;
                if (keys.left) player.x -= player.speed;
                if (keys.right) player.x += player.speed;

                player.x = Math.max(10, Math.min(canvas.width - 34, player.x));
                player.y = Math.max(150, Math.min(canvas.height - 40, player.y));

                let dx = (player.x + player.width / 2) - (mainBoy.x + mainBoy.width / 2);
                let dy = (player.y + player.height / 2) - (mainBoy.y + mainBoy.height / 2);
                let dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 32 && !choiceModal.classList.contains('hide-modal')) {
                    choiceModal.classList.remove('hidden');
                }
            }
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            switch (currentStage) {
                case STAGES.TITLE:
                    break;

                case STAGES.INTERACTIVE_COURTYARD:
                    drawGrassBG();
                    drawBoy(mainBoy.x, mainBoy.y);
                    drawGirl(player.x, player.y, '#FDE2D1', player.walking);
                    break;

                case STAGES.CHOICE_FAIL:
                    drawGrassBG();
                    drawBoy(mainBoy.x, mainBoy.y);
                    drawBubble(mainBoy.x + 12, mainBoy.y, "########");

                    player.x -= 2;
                    drawGirl(player.x, player.y, '#FDE2D1', true);

                    timer++;
                    if (timer > 150) {
                        player.x = 50;
                        player.y = 190;
                        choiceModal.classList.remove('hide-modal');
                        dpadOverlay.classList.remove('hidden');
                        currentStage = STAGES.INTERACTIVE_COURTYARD;
                    }
                    break;

                case STAGES.CUTSCENE_GIRLS:
                    drawGrassBG();
                    drawGirl(110, 170, '#FDE2D1');
                    drawGirl(220, 170, '#8D5524');
                    drawGirl(330, 170, '#FDE2D1');

                    timer++;
                    if (timer < 90) {
                        drawBubble(122, 170, "Me enamoré");
                    } else if (timer < 210) {
                        drawBubble(122, 170, "♥", true);
                        drawBubble(232, 170, "¡¿Qué?!", true);
                        drawBubble(342, 170, "♥ ♥", true);
                    } else if (timer === 210) {
                        triggerFade(() => {
                            currentStage = STAGES.CUTSCENE_BOYS;
                            timer = 0;
                        });
                    }
                    break;

                case STAGES.CUTSCENE_BOYS:
                    drawGrassBG();
                    drawBoy(100, 170);
                    drawBoy(230, 170, true);
                    drawBoy(360, 170, false);

                    timer++;
                    if (timer > 20 && timer < 100) {
                        drawBubble(112, 170, "me enamore bld");
                    } else if (timer >= 100 && timer < 170) {
                        drawBubble(242, 170, "Quien es?");
                    } else if (timer >= 170 && timer < 260) {
                        drawBubble(112, 170, "La Sol Luis");
                    } else if (timer >= 260 && timer < 340) {
                        drawBubble(242, 170, "la blanca del fondo");
                    } else if (timer >= 340 && timer < 410) {
                        drawBubble(112, 170, "sii esaaa");
                    } else if (timer >= 410 && timer < 510) {
                        drawBubble(242, 170, "que bien Gallo,ojala...");
                    } else if (timer >= 510) {
                        triggerFade(() => {
                            currentStage = STAGES.CUTSCENE_ROOM_PHONE_1;
                            timer = 0;
                        });
                    }
                    break;

                case STAGES.CUTSCENE_ROOM_PHONE_1:
                    drawDarkRoomBG();
                    drawBoy(228, 175);
                    drawPhoneChat(
                        "Holaaaa,soy gallo Me apareciste...",
                        "Holaaaa okokkk"
                    );

                    timer++;
                    if (timer > 180) {
                        currentStage = STAGES.TRANSITION_DAYS;
                        timer = 0;
                    }
                    break;

                case STAGES.TRANSITION_DAYS:
                    ctx.fillStyle = '#FFF066';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#000000';
                    ctx.font = '10px "Press Start 2P"';
                    ctx.textAlign = 'center';
                    ctx.fillText("Dias Despues...", canvas.width / 2, canvas.height / 2);

                    timer++;
                    if (timer > 100) {
                        currentStage = STAGES.CUTSCENE_BED_PHONE;
                        timer = 0;
                    }
                    break;

                case STAGES.CUTSCENE_BED_PHONE:
                    drawDarkRoomBG();
                    drawBoy(215, 170, false, true);

                    timer++;
                    if (timer < 110) {
                        drawBubble(225, 155, "Que linda que es...", true);
                    } else {
                        drawPhoneChat("Holaaaaaaa", "bienn y vosssss?");
                    }

                    if (timer > 240) {
                        currentStage = STAGES.TRANSITION_DECLARATION;
                        timer = 0;
                    }
                    break;

                case STAGES.TRANSITION_DECLARATION:
                    ctx.fillStyle = '#FFF066';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#000000';
                    ctx.font = '10px "Press Start 2P"';
                    ctx.textAlign = 'center';
                    ctx.fillText("Si me declaro?", canvas.width / 2, canvas.height / 2);

                    timer++;
                    if (timer > 100) {
                        currentStage = STAGES.CUTSCENE_FINAL_PROPOSAL;
                        timer = 0;
                        player.x = 280;
                        player.y = 170;
                    }
                    break;

                case STAGES.CUTSCENE_FINAL_PROPOSAL:
                    drawGrassBG();
                    drawBoy(150, 170);

                    timer++;

                    if (timer < 110) {
                        drawGirl(player.x, player.y);
                        drawBubble(162, 170, "¿Queres ser mi novia?");
                    } else if (timer >= 110 && timer < 180) {
                        drawGirl(player.x, player.y);
                        drawBubble(player.x + 12, player.y, "mmmmm bueno");
                    } else {
                        player.x += 4;
                        drawGirl(player.x, player.y, '#FDE2D1', true);
                    }

                    if (timer > 260) {
                        triggerFade(() => {
                            currentStage = STAGES.FINAL_TE_AMO;
                            timer = 0;
                        });
                    }
                    break;

                case STAGES.FINAL_TE_AMO:
                    ctx.fillStyle = '#FFB6C1';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#D2143A';
                    ctx.font = '11px "Press Start 2P"';
                    ctx.textAlign = 'center';
                    ctx.fillText("TE AMO MI", canvas.width / 2, canvas.height / 2 - 12);
                    ctx.fillText("GORDITA HERMOSA", canvas.width / 2, canvas.height / 2 + 12);

                    timer++;
                    if (timer > 120) {
                        currentStage = STAGES.FINAL_DATE;
                    }
                    break;

                case STAGES.FINAL_DATE:
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.font = '14px "Press Start 2P"';
                    ctx.textAlign = 'center';
                    ctx.fillText("14/05/26", canvas.width / 2, canvas.height / 2);
                    break;
            }

            if (isFading) {
                ctx.fillStyle = `rgba(0, 0, 0, ${fadeAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
